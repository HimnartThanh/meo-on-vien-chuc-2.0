<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130">
  <!-- Shadow -->
  <ellipse cx="60" cy="118" rx="36" ry="10" fill="#5C4533" opacity="0.2"/>

  <!-- Round Bear Tail -->
  <circle cx="86" cy="94" r="8" fill="#8D5B4C" stroke="#4E342E" stroke-width="2"/>

  <!-- Chubby Bear Legs/Feet -->
  <ellipse cx="44" cy="112" rx="11" ry="8" fill="#8D5B4C" stroke="#4E342E" stroke-width="2"/>
  <ellipse cx="44" cy="113" rx="6" ry="4" fill="#EED9C4"/>
  <ellipse cx="76" cy="112" rx="11" ry="8" fill="#8D5B4C" stroke="#4E342E" stroke-width="2"/>
  <ellipse cx="76" cy="113" rx="6" ry="4" fill="#EED9C4"/>

  <!-- Chubby Pear-shaped Bear Body -->
  <path d="M 36,70 Q 28,110 60,112 Q 92,110 84,70 Z" fill="#9E6B55" stroke="#4E342E" stroke-width="2.5"/>
  <!-- Light Beige Belly Patch -->
  <ellipse cx="60" cy="90" rx="18" ry="15" fill="#F5E6D3" stroke="#4E342E" stroke-width="1.5"/>

  <!-- Cute Red Bowtie on Chest -->
  <g id="bowtie" transform="translate(60, 72)">
    <polygon points="0,0 -10,-5 -10,5" fill="#E53935" stroke="#B71C1C" stroke-width="1.5"/>
    <polygon points="0,0 10,-5 10,5" fill="#E53935" stroke="#B71C1C" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FFCDD2" stroke="#B71C1C" stroke-width="1.5"/>
  </g>

  <!-- Paws (Hands) -->
  <ellipse cx="36" cy="82" rx="7" ry="6" fill="#9E6B55" stroke="#4E342E" stroke-width="2"/>
  <circle cx="36" cy="83" r="3" fill="#EED9C4"/>
  <!-- Right Paw waving cheerfully -->
  <ellipse cx="86" cy="74" rx="7" ry="6" fill="#9E6B55" stroke="#4E342E" stroke-width="2"/>
  <circle cx="86" cy="74" r="3" fill="#EED9C4"/>

  <!-- Round Bear Head -->
  <ellipse cx="60" cy="48" rx="34" ry="28" fill="#9E6B55" stroke="#4E342E" stroke-width="2.5"/>

  <!-- Round Bear Ears -->
  <circle cx="32" cy="26" r="12" fill="#9E6B55" stroke="#4E342E" stroke-width="2.5"/>
  <circle cx="33" cy="27" r="7" fill="#EED9C4"/>
  <circle cx="88" cy="26" r="12" fill="#9E6B55" stroke="#4E342E" stroke-width="2.5"/>
  <circle cx="87" cy="27" r="7" fill="#EED9C4"/>

  <!-- Beige Snout / Muzzle -->
  <ellipse cx="60" cy="53" rx="14" ry="10" fill="#F5E6D3" stroke="#4E342E" stroke-width="1.5"/>

  <!-- Big Sparkling Warm Brown Eyes -->
  <circle cx="46" cy="43" r="5" fill="#2C1810"/>
  <circle cx="44.5" cy="41" r="1.8" fill="#FFFFFF"/>
  <circle cx="48" cy="44.5" r="0.8" fill="#FFFFFF"/>
  <circle cx="74" cy="43" r="5" fill="#2C1810"/>
  <circle cx="72.5" cy="41" r="1.8" fill="#FFFFFF"/>
  <circle cx="76" cy="44.5" r="0.8" fill="#FFFFFF"/>

  <!-- Cute Bear Nose & Smile -->
  <ellipse cx="60" cy="49" rx="5" ry="3.5" fill="#3E2723"/>
  <path d="M 60,52 L 60,56 M 56,56 Q 60,59 64,56" fill="none" stroke="#4E342E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="36" cy="52" rx="5.5" ry="3.5" fill="#FF8A80" opacity="0.5"/>
  <ellipse cx="84" cy="52" rx="5.5" ry="3.5" fill="#FF8A80" opacity="0.5"/>
</svg>