    <path d="M 0,4 Q -8,-6 -2,-12 Q 2,-6 0,4 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.2"/>
    <path d="M 0,4 Q 8,-4 10,-10 Q 4,-6 0,4 Z" fill="#81C784" stroke="#2E7D32" stroke-width="1.2"/>
