  <!-- Pointy Duck Tail Feathers -->
  <path d="M 82,88 Q 96,82 92,96 Q 86,102 80,98 Z" fill="#FFF176" stroke="#5D4037" stroke-width="2"/>

  <!-- Orange Webbed Feet -->
  <path d="M 40,112 L 48,112 L 44,106 Z" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
  <ellipse cx="44" cy="112" rx="10" ry="5" fill="#FF9800" stroke="#E65100" stroke-width="1.8"/>
  <path d="M 72,112 L 80,112 L 76,106 Z" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
  <ellipse cx="76" cy="112" rx="10" ry="5" fill="#FF9800" stroke="#E65100" stroke-width="1.8"/>

  <!-- Chubby Round Duck Body -->
  <ellipse cx="60" cy="88" rx="28" ry="24" fill="#FFF176" stroke="#5D4037" stroke-width="2.5"/>
  <!-- Belly Highlight -->
  <ellipse cx="60" cy="94" rx="18" ry="14" fill="#FFFDE7"/>

  <!-- Cute Flapping Wings -->
  <!-- Left Wing -->
  <path d="M 34,78 Q 20,86 28,96 Q 36,92 36,84 Z" fill="#FFEE58" stroke="#5D4037" stroke-width="2"/>
  <!-- Right Wing waving -->
  <path d="M 86,78 Q 100,74 96,88 Q 88,92 84,84 Z" fill="#FFEE58" stroke="#5D4037" stroke-width="2"/>

  <!-- Round Cute Duck Head -->
