  </g>

  <!-- Big Sparkly Eyes -->
  <circle cx="48" cy="46" r="5.5" fill="#2C1810"/>
  <circle cx="46.5" cy="44" r="2" fill="#FFFFFF"/>
  <circle cx="50" cy="47.5" r="0.8" fill="#FFFFFF"/>
  <circle cx="72" cy="46" r="5.5" fill="#2C1810"/>
  <circle cx="70.5" cy="44" r="2" fill="#FFFFFF"/>
  <circle cx="74" cy="47.5" r="0.8" fill="#FFFFFF"/>

