  <ellipse cx="38" cy="53" rx="6" ry="4" fill="#FF8A80" opacity="0.55"/>
  <ellipse cx="82" cy="53" rx="6" ry="4" fill="#FF8A80" opacity="0.55"/>

  <!-- Cute Rounded Orange Duck Bill (Beak) -->
  <path d="M 50,52 Q 60,46 70,52 Q 74,60 60,62 Q 46,60 50,52 Z" fill="#FFA726" stroke="#E65100" stroke-width="2"/>
  <ellipse cx="60" cy="53" rx="8" ry="3" fill="#FFB74D"/>
