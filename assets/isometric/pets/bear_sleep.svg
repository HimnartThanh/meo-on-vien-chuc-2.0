<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Shadow -->
  <ellipse cx="60" cy="78" rx="44" ry="14" fill="#5C4533" opacity="0.2"/>

  <!-- Curled Sleeping Body (Chubby Bread Loaf) -->
  <path d="M 35,46 C 18,55 18,80 44,82 C 76,85 98,76 94,54 C 92,38 72,34 50,40 Z" fill="#9E6B55" stroke="#4E342E" stroke-width="2.5"/>
  <!-- Light Belly patch -->
  <ellipse cx="58" cy="62" rx="16" ry="12" fill="#F5E6D3"/>

  <!-- Cute Yellow Star Pillow hugged by Bear -->
  <polygon points="56,66 59,73 67,73 60,78 63,85 56,80 49,85 52,78 45,73 53,73" fill="#FFD54F" stroke="#FFA000" stroke-width="1.5"/>

  <!-- Head tucked in sleeping -->
  <ellipse cx="38" cy="50" rx="22" ry="18" fill="#9E6B55" stroke="#4E342E" stroke-width="2.5"/>

  <!-- Ears flattened peacefully -->
  <circle cx="25" cy="38" r="8" fill="#9E6B55" stroke="#4E342E" stroke-width="2"/>
  <circle cx="25" cy="38" r="4.5" fill="#EED9C4"/>

  <!-- Snout -->
  <ellipse cx="44" cy="54" rx="10" ry="7" fill="#F5E6D3" stroke="#4E342E" stroke-width="1.2"/>
  <ellipse cx="46" cy="52" rx="3.5" ry="2.5" fill="#3E2723"/>

  <!-- Sleeping Eyes (Curved happy lines ^^) -->
  <path d="M 28,48 Q 33,52 38,48" fill="none" stroke="#4E342E" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="30" cy="54" rx="4" ry="2.5" fill="#FF8A80" opacity="0.5"/>

  <!-- Paw resting on pillow -->
  <circle cx="48" cy="64" r="5" fill="#9E6B55" stroke="#4E342E" stroke-width="1.5"/>

  <!-- Floating Zzz Bubbles -->
  <g id="zzz-bubbles" fill="#FF7043" font-family="'Nunito', sans-serif" font-weight="900">
    <text x="70" y="38" font-size="12" opacity="0.7">z</text>
    <text x="80" y="26" font-size="15" opacity="0.85">Z</text>
    <text x="92" y="14" font-size="18" opacity="0.95">Z</text>
  </g>
</svg>