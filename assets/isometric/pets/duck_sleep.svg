<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Shadow -->
  <ellipse cx="60" cy="78" rx="38" ry="12" fill="#5C4533" opacity="0.2"/>

  <!-- Curled Sleeping Duck Ball -->
  <ellipse cx="60" cy="62" rx="32" ry="22" fill="#FFF176" stroke="#5D4037" stroke-width="2.5"/>
  <!-- Belly highlight -->
  <ellipse cx="60" cy="68" rx="20" ry="12" fill="#FFFDE7"/>

  <!-- Tiny Feathery Tail sticking out -->
  <path d="M 90,56 Q 98,52 94,64 Z" fill="#FFEE58" stroke="#5D4037" stroke-width="1.8"/>

  <!-- Head tucked down into body -->
  <circle cx="42" cy="52" r="18" fill="#FFF176" stroke="#5D4037" stroke-width="2.2"/>

  <!-- Sprout on head -->
  <path d="M 36,34 Q 30,28 34,22 Q 38,28 36,34 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="1"/>

  <!-- Sleeping Closed Eye (Curved happy line) -->
  <path d="M 32,50 Q 37,54 42,50" fill="none" stroke="#5D4037" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="34" cy="55" rx="4" ry="2" fill="#FF8A80" opacity="0.5"/>

  <!-- Orange Bill tucked in cozily -->
  <ellipse cx="50" cy="58" rx="8" ry="4" fill="#FFA726" stroke="#E65100" stroke-width="1.5"/>

  <!-- Wing folded peacefully over body -->
  <path d="M 46,58 Q 65,52 74,68 Q 60,76 46,68 Z" fill="#FFEE58" stroke="#5D4037" stroke-width="1.8"/>

  <!-- Floating Zzz Bubbles -->
  <g id="zzz-bubbles" fill="#FFB300" font-family="'Nunito', sans-serif" font-weight="900">
    <text x="70" y="38" font-size="12" opacity="0.7">z</text>
    <text x="80" y="26" font-size="15" opacity="0.85">Z</text>
    <text x="92" y="14" font-size="18" opacity="0.95">Z</text>
  </g>
</svg>