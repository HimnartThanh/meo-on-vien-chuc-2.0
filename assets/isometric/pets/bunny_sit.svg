<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Shadow -->
  <ellipse cx="60" cy="110" rx="34" ry="9" fill="#5C4533" opacity="0.2"/>

  <!-- Tail behind -->
  <circle cx="84" cy="94" r="8" fill="#FFFFFF" stroke="#5E432E" stroke-width="2"/>

  <!-- Sitting Hind Feet -->
  <ellipse cx="38" cy="102" rx="10" ry="7" fill="#FFFFFF" stroke="#5E432E" stroke-width="2"/>
  <ellipse cx="82" cy="102" rx="10" ry="7" fill="#FFFFFF" stroke="#5E432E" stroke-width="2"/>

  <!-- Bunny Body in Pink Dungarees Sitting -->
  <path d="M 36,68 Q 30,102 60,104 Q 90,102 84,68 Z" fill="#FFFFFF" stroke="#5E432E" stroke-width="2.5"/>
  <path d="M 38,80 L 82,80 L 82,102 Q 60,104 38,102 Z" fill="#F8BBD0" stroke="#5E432E" stroke-width="2"/>
  <line x1="46" y1="72" x2="46" y2="82" stroke="#F06292" stroke-width="2.5"/>
  <line x1="74" y1="72" x2="74" y2="82" stroke="#F06292" stroke-width="2.5"/>

  <!-- Head tilted forward reading -->
  <ellipse cx="60" cy="46" rx="32" ry="26" fill="#FFFFFF" stroke="#5E432E" stroke-width="2.5"/>

  <!-- Long Bunny Ears -->
  <g id="left-ear">
    <path d="M 44,28 C 36,0 52,0 50,28 Z" fill="#FFFFFF" stroke="#5E432E" stroke-width="2.5"/>
    <path d="M 44,25 C 40,6 48,6 48,25 Z" fill="#F8BBD0"/>
  </g>
  <g id="right-ear">
    <path d="M 72,28 C 80,4 96,16 88,30 Z" fill="#FFFFFF" stroke="#5E432E" stroke-width="2.5"/>
    <path d="M 74,26 C 80,10 90,18 84,28 Z" fill="#F8BBD0"/>
  </g>

  <!-- Focused Eyes Looking Down -->
  <ellipse cx="48" cy="44" rx="4.5" ry="5.5" fill="#2C1810"/>
  <circle cx="47" cy="42.5" r="1.8" fill="#FFFFFF"/>
  <ellipse cx="72" cy="44" rx="4.5" ry="5.5" fill="#2C1810"/>
  <circle cx="71" cy="42.5" r="1.8" fill="#FFFFFF"/>

  <!-- Pink Nerd Reading Glasses -->
  <circle cx="48" cy="44" r="7.5" fill="none" stroke="#E91E63" stroke-width="1.8"/>
  <circle cx="72" cy="44" r="7.5" fill="none" stroke="#E91E63" stroke-width="1.8"/>
  <line x1="55.5" y1="44" x2="64.5" y2="44" stroke="#E91E63" stroke-width="1.8"/>

  <!-- Cheeks & Nose -->
  <ellipse cx="38" cy="49" rx="5.5" ry="3.5" fill="#FF80AB" opacity="0.5"/>
  <ellipse cx="82" cy="49" rx="5.5" ry="3.5" fill="#FF80AB" opacity="0.5"/>
  <polygon points="58,49 62,49 60,52" fill="#E91E63"/>
  <path d="M 57,52 Q 60,54 63,52" fill="none" stroke="#5E432E" stroke-width="1.5"/>

  <!-- Study Book held in white paws -->
  <g id="reading-book" transform="translate(40, 68)">
    <path d="M 0,22 L 20,12 L 40,22 L 20,30 Z" fill="#F48FB1" stroke="#C2185B" stroke-width="2"/>
    <path d="M 2,21 L 20,13 L 38,21 L 20,28 Z" fill="#FFFFFF" stroke="#5E432E" stroke-width="1"/>
    <line x1="20" y1="13" x2="20" y2="28" stroke="#C2185B" stroke-width="1.5"/>
    <line x1="8" y1="19" x2="16" y2="15" stroke="#F8BBD0" stroke-width="1"/>
    <line x1="24" y1="15" x2="32" y2="19" stroke="#F8BBD0" stroke-width="1"/>
    <!-- Paws on book -->
    <circle cx="2" cy="20" r="4.5" fill="#FFFFFF" stroke="#5E432E" stroke-width="1.5"/>
    <circle cx="38" cy="20" r="4.5" fill="#FFFFFF" stroke="#5E432E" stroke-width="1.5"/>
  </g>
</svg>