<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 105" width="85" height="105">
  <!-- Swinging Tail Pendulum -->
  <path d="M 42,74 Q 52,88 40,98" fill="none" stroke="#5E432E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="40" cy="98" r="4" fill="#FFB7B2" stroke="#5E432E" stroke-width="2"/>

  <!-- Cat Ears -->
  <polygon points="18,28 11,8 31,18" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="67,28 74,8 54,18" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Clock Outer Rim -->
  <circle cx="42.5" cy="45" r="28" fill="#FFB7B2" stroke="#5E432E" stroke-width="2.8"/>
  <circle cx="42.5" cy="45" r="22" fill="#FFFDF9" stroke="#5E432E" stroke-width="2"/>

  <!-- Hour Ticks -->
  <circle cx="42.5" cy="27" r="1.8" fill="#5E432E"/>
  <circle cx="60.5" cy="45" r="1.8" fill="#5E432E"/>
  <circle cx="42.5" cy="63" r="1.8" fill="#5E432E"/>
  <circle cx="24.5" cy="45" r="1.8" fill="#5E432E"/>

  <!-- Clock Hands -->
  <line x1="42.5" y1="45" x2="42.5" y2="32" stroke="#3B2314" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="42.5" y1="45" x2="53" y2="45" stroke="#C84B66" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="42.5" cy="45" r="3" fill="#3B2314"/>
</svg>
