<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 105" width="90" height="105">
  <!-- Soft Wall Shadow -->
  <rect x="13" y="19" width="68" height="78" rx="8" fill="#5C4533" opacity="0.18"/>

  <!-- Hanging Cord -->
  <path d="M 28,16 L 45,4 L 62,16" fill="none" stroke="#8C5A32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="4" r="3.5" fill="#FFD166" stroke="#5E432E" stroke-width="1.8"/>

  <!-- Golden Wood Frame -->
  <rect x="9" y="14" width="72" height="78" rx="7" fill="#E6A13C" stroke="#5E432E" stroke-width="2.8"/>
  <rect x="15" y="20" width="60" height="66" rx="4" fill="#FFFDF7" stroke="#5E432E" stroke-width="1.8"/>

  <!-- Decorative Inner Border -->
  <rect x="20" y="25" width="50" height="56" rx="2" fill="none" stroke="#E6C587" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Award Star Emblem -->
  <circle cx="45" cy="42" r="11" fill="#FDE8E8" stroke="#C84B66" stroke-width="1.8"/>
  <polygon points="45,33 47.4,38.2 53,39 48.9,42.8 49.9,48.4 45,45.7 40.1,48.4 41.1,42.8 37,39 42.6,38.2" fill="#FFD166" stroke="#5E432E" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Clean Decorative Lines (No Text) -->
  <line x1="27" y1="60" x2="63" y2="60" stroke="#5E432E" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="67" x2="58" y2="67" stroke="#C6A992" stroke-width="2" stroke-linecap="round"/>

  <!-- Red Award Ribbon Tails -->
  <polygon points="39,74 36,96 45,90 54,96 51,74" fill="#D9536F" stroke="#5E432E" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="45" cy="74" r="5" fill="#FFD166" stroke="#5E432E" stroke-width="1.8"/>
</svg>
