<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 115" width="95" height="115">
  <!-- Hanging String -->
  <path d="M 30,16 L 47.5,4 L 65,16" fill="none" stroke="#8C5A32" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="47.5" cy="4" r="3.5" fill="#FFD166" stroke="#5E432E" stroke-width="1.8"/>

  <!-- Top & Bottom Wooden Scroll Bars -->
  <rect x="10" y="13" width="75" height="8" rx="4" fill="#C68B59" stroke="#5E432E" stroke-width="2.4"/>
  <rect x="14" y="21" width="67" height="78" fill="#FFF9F4" stroke="#5E432E" stroke-width="2.4"/>
  <rect x="10" y="99" width="75" height="8" rx="4" fill="#C68B59" stroke="#5E432E" stroke-width="2.4"/>

  <!-- Pure Vector Artwork Inside (Rising Sun, Mountain & Sakura Branch - No Text) -->
  <circle cx="47.5" cy="48" r="15" fill="#FFD166" opacity="0.85"/>
  <polygon points="16,97 38,64 60,97" fill="#88C9B3" stroke="#5E432E" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="40,97 58,70 79,97" fill="#529E7E" stroke="#5E432E" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Little Sakura Flowers -->
  <circle cx="28" cy="34" r="4.5" fill="#FFB7C5" stroke="#5E432E" stroke-width="1.4"/>
  <circle cx="67" cy="38" r="4" fill="#FFB7C5" stroke="#5E432E" stroke-width="1.4"/>
</svg>
