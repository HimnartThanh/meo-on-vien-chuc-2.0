  <polygon points="40,47 60,38 74,45 54,54" fill="#76B8A1" stroke="#5E432E" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="40,42 60,33 74,40 54,49" fill="#FFD166" stroke="#5E432E" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Sunflower Vase -->
