<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130" width="180" height="130">
  <!-- Soft Wall Shadow -->
  <rect x="14" y="16" width="156" height="96" rx="10" fill="#5C4533" opacity="0.18"/>

  <!-- Hanging Cord & Pin -->
  <path d="M 55,18 L 90,5 L 125,18" fill="none" stroke="#8C5A32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="90" cy="5" r="4" fill="#FFD166" stroke="#5E432E" stroke-width="2"/>

  <!-- Warm Wooden Frame -->
  <rect x="10" y="12" width="160" height="94" rx="9" fill="#D4956A" stroke="#5E432E" stroke-width="3"/>
  <rect x="15" y="17" width="150" height="84" rx="6" fill="#E6AE82"/>

  <!-- Slate Green Chalkboard Surface (Clean, No Text) -->
  <rect x="20" y="22" width="140" height="74" rx="4" fill="#1E5645" stroke="#3B2314" stroke-width="2.2"/>

  <!-- Subtle Chalkboard Shine -->
  <path d="M 26,30 L 42,26 L 30,44 Z" fill="#FFFFFF" opacity="0.08"/>

  <!-- Cute Pure-Vector Chalk Illustrations (No Text) -->
  <!-- Set-Square Triangle Ruler -->
  <polygon points="34,78 34,42 70,78" fill="none" stroke="#FFF3B0" stroke-width="2.2" stroke-linejoin="round" opacity="0.88"/>
  <polygon points="41,72 41,55 58,72" fill="none" stroke="#FFF3B0" stroke-width="1.5" stroke-linejoin="round" opacity="0.75"/>

  <!-- Geometric Cube & Star Doodle -->
  <polygon points="95,38 113,30 131,38 113,46" fill="none" stroke="#A8E6CF" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>
  <polyline points="95,38 95,56 113,64 131,56 131,38" fill="none" stroke="#A8E6CF" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>
  <line x1="113" y1="46" x2="113" y2="64" stroke="#A8E6CF" stroke-width="2" opacity="0.85"/>

  <!-- Little Chalk Flower / Sakura Accent -->
  <circle cx="142" cy="40" r="3" fill="#FFD166" opacity="0.9"/>
  <circle cx="142" cy="33" r="3" fill="#FFB7B2" opacity="0.85"/>
  <circle cx="142" cy="47" r="3" fill="#FFB7B2" opacity="0.85"/>
  <circle cx="135" cy="40" r="3" fill="#FFB7B2" opacity="0.85"/>
  <circle cx="149" cy="40" r="3" fill="#FFB7B2" opacity="0.85"/>

  <!-- Decorative Dotted Wave Line -->
  <path d="M 82,76 Q 98,68 114,76 T 146,76" fill="none" stroke="#FFD1DC" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.85"/>

  <!-- Wooden Chalk Ledge -->
  <rect x="6" y="102" width="168" height="10" rx="4" fill="#A46B3F" stroke="#5E432E" stroke-width="2.8"/>

  <!-- Chalk Pieces & Eraser -->
  <rect x="102" y="97" width="14" height="5" rx="2" fill="#FFFFFF" stroke="#5E432E" stroke-width="1.5"/>
  <rect x="119" y="97" width="14" height="5" rx="2" fill="#FFB7B2" stroke="#5E432E" stroke-width="1.5"/>
  <rect x="137" y="93" width="22" height="9" rx="2.5" fill="#FFD166" stroke="#5E432E" stroke-width="2"/>
  <rect x="137" y="98" width="22" height="4" rx="1" fill="#5E432E"/>
</svg>
