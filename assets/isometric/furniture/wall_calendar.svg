  <rect x="44.5" y="10" width="6" height="12" rx="3" fill="#FFD166" stroke="#5E432E" stroke-width="2"/>
  <rect x="63" y="10" width="6" height="12" rx="3" fill="#FFD166" stroke="#5E432E" stroke-width="2"/>

  <!-- Clean Geometric Date Grid (No Text) -->
